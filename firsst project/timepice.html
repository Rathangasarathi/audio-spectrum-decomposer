<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timepiece — Clock & Stopwatch</title>
  <meta name="description"
    content="A premium clock and stopwatch application featuring a sleek black, beige, and white design." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=DM+Mono:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #0e0e0e;
      --charcoal: #1a1a1a;
      --dark: #222222;
      --beige: #d4c5a9;
      --light-beige: #e8dece;
      --cream: #f4ede0;
      --white: #faf8f4;
      --accent: #c6a96e;
      --muted: #7a7060;
      --radius: 20px;
      --transition: 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html,
    body {
      height: 100%;
      font-family: 'Outfit', sans-serif;
      background: var(--black);
      color: var(--white);
      overflow: hidden;
    }

    /* === BACKGROUND GRADIENT === */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(196, 169, 110, 0.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 80% 80%, rgba(212, 197, 169, 0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* === CANVAS === */
    .scene {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
      gap: 32px;
    }

    /* === HEADER === */
    .header {
      text-align: center;
    }

    .header h1 {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--beige);
      opacity: 0.75;
    }

    .header .dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      margin: 0 6px;
      vertical-align: middle;
      animation: pulse 2s ease-in-out infinite;
    }

    /* === CARD === */
    .card {
      background: var(--charcoal);
      border: 1px solid rgba(212, 197, 169, 0.12);
      border-radius: calc(var(--radius) + 8px);
      padding: clamp(36px, 6vw, 56px) clamp(36px, 8vw, 80px);
      box-shadow:
        0 32px 80px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.03) inset,
        0 1px 0 rgba(212, 197, 169, 0.08) inset;
      min-width: min(92vw, 520px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 70%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(198, 169, 110, 0.4), transparent);
    }

    /* === MODE TOGGLE === */
    .toggle-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      background: var(--dark);
      border-radius: 100px;
      padding: 5px;
      border: 1px solid rgba(212, 197, 169, 0.1);
      margin-bottom: 40px;
      width: fit-content;
      margin-inline: auto;
    }

    .toggle-btn {
      all: unset;
      cursor: pointer;
      padding: 9px 26px;
      border-radius: 100px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      transition: all var(--transition);
      user-select: none;
      white-space: nowrap;
    }

    .toggle-btn.active {
      background: var(--beige);
      color: var(--black);
      font-weight: 500;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
    }

    /* === DISPLAY === */
    .display-area {
      position: relative;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Clock mode */
    #clock-view,
    #stopwatch-view {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: opacity 0.3s ease, transform 0.35s ease;
    }

    #clock-view.hidden,
    #stopwatch-view.hidden {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
      position: absolute;
    }

    .time-digits {
      font-family: 'DM Mono', monospace;
      font-size: clamp(3.6rem, 12vw, 6rem);
      font-weight: 300;
      color: var(--white);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .time-digits .sep {
      color: var(--accent);
      opacity: 0.7;
      animation: blink 1s step-end infinite;
    }

    .time-ms {
      font-family: 'DM Mono', monospace;
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      font-weight: 300;
      color: var(--beige);
      letter-spacing: 0.04em;
      opacity: 0.75;
    }

    .clock-date {
      font-family: 'Outfit', sans-serif;
      font-size: 0.86rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .ampm {
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 300;
      color: var(--beige);
      letter-spacing: 0.2em;
      opacity: 0.65;
      margin-left: 8px;
      vertical-align: middle;
    }

    /* === STOPWATCH LAPS DIVIDER === */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(212, 197, 169, 0.15), transparent);
      margin: 28px 0 22px;
    }

    /* === CONTROLS === */
    .controls {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      all: unset;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: 100px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.25s ease;
      user-select: none;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: var(--beige);
      color: var(--black);
      box-shadow: 0 4px 20px rgba(198, 169, 110, 0.25);
    }

    .btn-primary:hover {
      background: var(--light-beige);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(198, 169, 110, 0.35);
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-primary.running {
      background: var(--black);
      color: var(--beige);
      border-color: rgba(212, 197, 169, 0.3);
    }

    .btn-primary.running:hover {
      background: var(--dark);
      border-color: rgba(212, 197, 169, 0.5);
    }

    .btn-secondary {
      background: transparent;
      color: var(--muted);
      border-color: rgba(212, 197, 169, 0.15);
    }

    .btn-secondary:hover {
      color: var(--beige);
      border-color: rgba(212, 197, 169, 0.35);
      background: rgba(212, 197, 169, 0.05);
    }

    .btn-secondary:active {
      transform: scale(0.97);
    }

    .btn-secondary:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* === LAPS === */
    .laps-section {
      margin-top: 0;
      max-height: 160px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(212, 197, 169, 0.2) transparent;
    }

    .laps-section::-webkit-scrollbar {
      width: 4px;
    }

    .laps-section::-webkit-scrollbar-thumb {
      background: rgba(212, 197, 169, 0.2);
      border-radius: 4px;
    }

    .lap-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(212, 197, 169, 0.07);
      animation: fadeSlide 0.25s ease;
    }

    .lap-item:last-child {
      border-bottom: none;
    }

    .lap-num {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 400;
    }

    .lap-time {
      font-family: 'DM Mono', monospace;
      font-size: 0.92rem;
      color: var(--beige);
      font-weight: 400;
    }

    .lap-item.best .lap-num {
      color: var(--accent);
    }

    .lap-item.best .lap-time {
      color: var(--accent);
    }

    /* === STATUS PILL === */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 100px;
      background: rgba(212, 197, 169, 0.06);
      border: 1px solid rgba(212, 197, 169, 0.12);
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s ease;
    }

    .status-dot.live {
      background: #5fdf8c;
      box-shadow: 0 0 6px rgba(95, 223, 140, 0.5);
      animation: pulse 1.5s ease-in-out infinite;
    }

    .status-dot.running {
      background: var(--accent);
      box-shadow: 0 0 6px rgba(198, 169, 110, 0.5);
      animation: pulse 1s ease-in-out infinite;
    }

    /* === FOOTER === */
    .footer {
      font-size: 0.68rem;
      color: var(--muted);
      opacity: 0.4;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* === ANIMATIONS === */
    @keyframes blink {

      0%,
      100% {
        opacity: 0.7;
      }

      50% {
        opacity: 0.2;
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.6;
        transform: scale(0.85);
      }
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* === RESPONSIVE === */
    @media (max-width: 480px) {
      .card {
        padding: 32px 24px;
      }
    }
  </style>
</head>

<body>

  <div class="scene">

    <div class="header">
      <h1>Time<span class="dot"></span>piece</h1>
    </div>

    <div class="card">

      <!-- Mode Toggle -->
      <div class="toggle-wrap" role="tablist" aria-label="Mode selector">
        <button class="toggle-btn active" id="btn-clock" role="tab" aria-selected="true"
          onclick="switchMode('clock')">Clock</button>
        <button class="toggle-btn" id="btn-stopwatch" role="tab" aria-selected="false"
          onclick="switchMode('stopwatch')">Stopwatch</button>
      </div>

      <!-- Status Pill -->
      <div class="status-pill" id="status-pill">
        <span class="status-dot live" id="status-dot"></span>
        <span id="status-text">Live</span>
      </div>

      <!-- ── CLOCK VIEW ── -->
      <div id="clock-view">
        <div class="time-digits" id="clock-time">
          <span id="cl-h">12</span><span class="sep">:</span><span id="cl-m">00</span><span class="sep">:</span><span
            id="cl-s">00</span><span class="ampm" id="cl-ampm">AM</span>
        </div>
        <div class="clock-date" id="cl-date">Saturday, 21 March 2026</div>
      </div>

      <!-- ── STOPWATCH VIEW ── -->
      <div id="stopwatch-view" class="hidden">
        <div class="time-digits" id="sw-time">
          <span id="sw-m">00</span><span class="sep" style="animation:none;opacity:0.7">:</span><span
            id="sw-s">00</span>
        </div>
        <div class="time-ms" id="sw-ms">.000</div>
      </div>

      <!-- Controls (shown only in stopwatch) -->
      <div id="sw-controls" style="display:none;">
        <div class="divider"></div>
        <div class="controls">
          <button class="btn btn-primary" id="btn-start-stop" onclick="toggleStopwatch()">Start</button>
          <button class="btn btn-secondary" id="btn-lap" onclick="recordLap()" disabled>Lap</button>
          <button class="btn btn-secondary" id="btn-reset" onclick="resetStopwatch()" disabled>Reset</button>
        </div>

        <!-- Laps -->
        <div class="laps-section" id="laps-list" style="margin-top:0;"></div>
      </div>

    </div>

    <div class="footer">Timepiece &nbsp;·&nbsp; Clock &amp; Stopwatch</div>

  </div>

  <script>
    // ── MODE ──
    let currentMode = 'clock';

    function switchMode(mode) {
      currentMode = mode;
      const clockView = document.getElementById('clock-view');
      const swView = document.getElementById('stopwatch-view');
      const swCtrls = document.getElementById('sw-controls');
      const btnClock = document.getElementById('btn-clock');
      const btnSW = document.getElementById('btn-stopwatch');

      if (mode === 'clock') {
        clockView.classList.remove('hidden');
        swView.classList.add('hidden');
        swCtrls.style.display = 'none';
        btnClock.classList.add('active');
        btnSW.classList.remove('active');
        btnClock.setAttribute('aria-selected', 'true');
        btnSW.setAttribute('aria-selected', 'false');
        updateStatusPill('live', 'Live');
      } else {
        clockView.classList.add('hidden');
        swView.classList.remove('hidden');
        swCtrls.style.display = 'block';
        btnSW.classList.add('active');
        btnClock.classList.remove('active');
        btnSW.setAttribute('aria-selected', 'true');
        btnClock.setAttribute('aria-selected', 'false');
        updateStatusPill(swRunning ? 'running' : '', swRunning ? 'Running' : 'Stopped');
      }
    }

    function updateStatusPill(type, text) {
      const dot = document.getElementById('status-dot');
      const span = document.getElementById('status-text');
      dot.className = 'status-dot ' + type;
      span.textContent = text;
    }

    // ── CLOCK ──
    function pad(n) { return String(n).padStart(2, '0'); }

    function updateClock() {
      const now = new Date();
      let h = now.getHours();
      const m = now.getMinutes();
      const s = now.getSeconds();
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;

      document.getElementById('cl-h').textContent = pad(h);
      document.getElementById('cl-m').textContent = pad(m);
      document.getElementById('cl-s').textContent = pad(s);
      document.getElementById('cl-ampm').textContent = ampm;

      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      document.getElementById('cl-date').textContent =
        `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
    }

    updateClock();
    setInterval(updateClock, 1000);

    // ── STOPWATCH ──
    let swRunning = false;
    let swStart = 0;
    let swElapsed = 0;
    let swRafId = null;
    let laps = [];

    function toggleStopwatch() {
      const btn = document.getElementById('btn-start-stop');
      if (!swRunning) {
        swStart = performance.now() - swElapsed;
        swRunning = true;
        btn.textContent = 'Pause';
        btn.classList.add('running');
        document.getElementById('btn-lap').disabled = false;
        document.getElementById('btn-reset').disabled = false;
        updateStatusPill('running', 'Running');
        swRafId = requestAnimationFrame(swTick);
      } else {
        swRunning = false;
        cancelAnimationFrame(swRafId);
        btn.textContent = 'Resume';
        btn.classList.remove('running');
        updateStatusPill('', 'Paused');
      }
    }

    function swTick() {
      swElapsed = performance.now() - swStart;
      renderSW(swElapsed);
      if (swRunning) swRafId = requestAnimationFrame(swTick);
    }

    function renderSW(ms) {
      const totalMs = Math.floor(ms);
      const millis = totalMs % 1000;
      const secs = Math.floor(totalMs / 1000) % 60;
      const mins = Math.floor(totalMs / 60000);

      document.getElementById('sw-m').textContent = pad(mins);
      document.getElementById('sw-s').textContent = pad(secs);
      document.getElementById('sw-ms').textContent = '.' + String(millis).padStart(3, '0');
    }

    function recordLap() {
      if (!swRunning) return;
      const lapTime = swElapsed;
      laps.unshift(lapTime);
      renderLaps();
    }

    function renderLaps() {
      const container = document.getElementById('laps-list');
      if (laps.length === 0) { container.innerHTML = ''; return; }

      // Find best (shortest) lap delta
      const deltas = laps.map((t, i) => {
        return t - (laps[i + 1] || 0);
      });
      const bestDelta = Math.min(...deltas);

      container.innerHTML = laps.map((t, i) => {
        const delta = t - (laps[i + 1] || 0);
        const isBest = (delta === bestDelta && laps.length > 1);
        return `<div class="lap-item${isBest ? ' best' : ''}">
        <span class="lap-num">Lap ${laps.length - i}${isBest ? ' ★' : ''}</span>
        <span class="lap-time">${formatLapTime(delta)}</span>
      </div>`;
      }).join('');
    }

    function formatLapTime(ms) {
      const m = Math.floor(ms / 60000);
      const s = Math.floor(ms / 1000) % 60;
      const mil = Math.floor(ms) % 1000;
      return `${pad(m)}:${pad(s)}.${String(mil).padStart(3, '0')}`;
    }

    function resetStopwatch() {
      swRunning = false;
      cancelAnimationFrame(swRafId);
      swElapsed = 0;
      laps = [];
      renderSW(0);
      renderLaps();
      const btn = document.getElementById('btn-start-stop');
      btn.textContent = 'Start';
      btn.classList.remove('running');
      document.getElementById('btn-lap').disabled = true;
      document.getElementById('btn-reset').disabled = true;
      updateStatusPill('', 'Stopped');
    }
  </script>
</body>

</html>
